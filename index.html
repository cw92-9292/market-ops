<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Market Ops Live</title>
<meta name="robots" content="noindex">
<style>
/* 관제실 화면 실시간판: 어두운 계기판, 고정폭 숫자, 상태등 */
:root{--bg:#0b1116;--panel:#111a21;--panel2:#0e161c;--line:#1f2c35;--line2:#2a3a45;--fg:#dbe7ee;--fg2:#8aa0ad;--fg3:#5d7280;--acc:#3fd0b4;--acc2:#5aa8ff;--warn:#f0b44c;--bad:#ff6b6b;
  --mono:ui-monospace,"Cascadia Mono","Consolas","Menlo",monospace;--sans:system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5}
.wrap{max-width:1200px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.brand{display:flex;align-items:center;gap:10px}
.led{width:9px;height:9px;border-radius:50%;background:var(--fg3);flex:0 0 auto}
.led.on{background:var(--acc);box-shadow:0 0 0 3px rgba(63,208,180,.15)}
.led.off{background:var(--bad)}
h1{margin:0;font-size:16px;font-weight:600}
.sys{font-family:var(--mono);font-size:11.5px;color:var(--fg3)}
.btn{appearance:none;font:inherit;font-family:var(--mono);font-size:11.5px;color:var(--fg2);background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:6px 10px;cursor:pointer}
.ctl{display:flex;flex-wrap:wrap;gap:8px}
a.btn{text-decoration:none;display:inline-block}
.btn:hover,.btn[aria-pressed="true"]{color:var(--acc);border-color:var(--acc)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tiles{display:grid;gap:1px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tile{background:var(--panel);padding:12px 14px;min-width:0}
.k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--fg3);text-transform:uppercase}
.v{display:block;margin-top:6px;font-family:var(--mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;transition:color .4s}
.s{display:block;margin-top:4px;font-family:var(--mono);font-size:11.5px;color:var(--fg3);font-variant-numeric:tabular-nums}
.up{color:var(--acc)}.down{color:var(--bad)}
.flash-up{color:var(--acc)!important}.flash-down{color:var(--bad)!important}
.p{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.ph{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
h2{margin:0;font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.12em;color:var(--fg2);text-transform:uppercase}
.seg{display:inline-flex;gap:2px;padding:2px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px}
.seg button{appearance:none;border:0;background:none;font-family:var(--mono);font-size:11.5px;color:var(--fg3);padding:4px 9px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--line2);color:var(--fg)}
.chart{position:relative;height:340px}
canvas{display:block;width:100%;height:100%}
.tip{position:absolute;pointer-events:none;background:#0a1015;border:1px solid var(--line2);border-radius:7px;padding:5px 8px;font-family:var(--mono);font-size:11.5px;white-space:nowrap}
.note{margin:8px 0 0;font-size:12px;color:var(--fg3)}
.tape{font-family:var(--mono);font-size:12px;max-height:240px;overflow:auto}
.tape div{display:grid;grid-template-columns:7em 1fr 1fr;gap:8px;padding:3px 0;border-bottom:1px solid var(--line)}
.tape span:nth-child(2),.tape span:nth-child(3){text-align:right;font-variant-numeric:tabular-nums}
.two{display:grid;gap:12px;grid-template-columns:2fr 1fr}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.cover .b-only{display:none}
.fx-only{display:none}
.cover .fx-only{display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="bar">
    <div class="brand"><span class="led" id="led"></span><div><h1>에너지·원자재 시장 모니터 · LIVE</h1><div class="sys" id="sys">연결 중…</div></div></div>
    <div class="ctl"><a class="btn" id="dash-link" href="https://claude.ai/artifact/57efNa98kaF8kjdVZK9ax4" target="_blank" rel="noopener">분석 대시보드 ↗</a>
    <button type="button" class="btn" id="cover" aria-pressed="false">요약만 보기 · ESC</button></div>
  </div>

  <div class="tiles">
    <div class="tile b-only"><span class="k">지표 B · USDT</span><span class="v" id="p-usd">—</span><span class="s">24H <b id="c-usd">—</b> · 고 <span id="h-usd">—</span> · 저 <span id="l-usd">—</span></span></div>
    <div class="tile b-only"><span class="k">지표 B · KRW</span><span class="v" id="p-krw">—</span><span class="s">24H <b id="c-krw">—</b></span></div>
    <div class="tile b-only"><span class="k">국내 프리미엄</span><span class="v" id="kp">—</span><span class="s">KRW ÷ (USDT × 원/달러)</span></div>
    <div class="tile"><span class="k">USD / KRW</span><span class="v" id="fx">—</span><span class="s" id="fxd">ECB 기준환율</span></div>
  </div>

  <div class="two b-only">
    <section class="p">
      <div class="ph"><h2>지표 B · 실시간 (USDT)</h2>
        <div class="seg" id="tf" role="group" aria-label="봉 간격">
          <button data-i="1m" aria-pressed="true">1분</button><button data-i="5m" aria-pressed="false">5분</button><button data-i="1h" aria-pressed="false">1시간</button><button data-i="1d" aria-pressed="false">1일</button>
        </div>
      </div>
      <div class="chart" id="chart"><canvas id="cv" role="img" aria-label="지표 B 실시간 가격 그래프"></canvas><div class="tip" id="tip" hidden></div></div>
      <p class="note">바이낸스 공개 시세(BTC/USDT)를 받아 그립니다. 마지막 봉은 체결될 때마다 바로 바뀝니다.</p>
    </section>
    <section class="p">
      <div class="ph"><h2>최근 체결 (KRW)</h2></div>
      <div class="tape" id="tape"></div>
      <p class="note">업비트 공개 체결 스트림(KRW-BTC).</p>
    </section>
  </div>
  <p class="note fx-only">환율과 원자재 지표를 모아 보는 화면입니다.</p>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const f0 = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });
  const f2 = new Intl.NumberFormat("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const pct = (v) => (v > 0 ? "+" : "") + v.toFixed(2) + "%";
  const BIN = "https://data-api.binance.vision", BWS = "wss://data-stream.binance.vision/ws";
  const st = { usd: null, krw: null, fx: null, bars: [], tf: "1m", ws: null, up: null, live: { b: false, u: false } };

  function setLive() {
    const on = st.live.b || st.live.u;
    $("led").className = "led " + (on ? "on" : "off");
    $("sys").textContent = "MARKET OPS · " + (st.live.b ? "B" : "-") + (st.live.u ? "U" : "-") + " · " + new Date().toLocaleTimeString("en-GB", { hour12: false });
  }
  function flash(el, dir) { el.classList.remove("flash-up", "flash-down"); void el.offsetWidth; el.classList.add(dir > 0 ? "flash-up" : "flash-down"); setTimeout(() => el.classList.remove("flash-up", "flash-down"), 500); }
  function signed(el, v) { el.textContent = pct(v); el.className = v >= 0 ? "up" : "down"; }
  function premium() { if (st.usd && st.krw && st.fx) { const k = (st.krw / (st.usd * st.fx) - 1) * 100; $("kp").textContent = pct(k); $("kp").className = "v " + (k >= 0 ? "up" : "down"); } }

  // 환율(ECB, 하루 한 번 바뀜)
  fetch("https://api.frankfurter.dev/v1/latest?base=USD&symbols=KRW").then((r) => r.json()).then((j) => { st.fx = j.rates.KRW; $("fx").textContent = f2.format(st.fx); $("fxd").textContent = "ECB 기준 " + j.date; premium(); }).catch(() => { $("fxd").textContent = "환율을 받지 못함"; });

  // 24시간 요약(바이낸스)
  const t24 = () => fetch(BIN + "/api/v3/ticker/24hr?symbol=BTCUSDT").then((r) => r.json()).then((j) => {
    signed($("c-usd"), +j.priceChangePercent); if (st.usd == null) { st.usd = +j.lastPrice; $("p-usd").textContent = f2.format(st.usd); premium(); } $("h-usd").textContent = f0.format(+j.highPrice); $("l-usd").textContent = f0.format(+j.lowPrice);
  }).catch(() => {});
  t24(); setInterval(t24, 60000);

  // 봉 그래프
  const cv = $("cv"), ctx = cv.getContext("2d");
  function draw() {
    const box = $("chart"), W = box.clientWidth, H = box.clientHeight, dpr = window.devicePixelRatio || 1;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    const b = st.bars; if (!b.length) return;
    const css = getComputedStyle(document.documentElement), col = (n) => css.getPropertyValue(n).trim();
    ctx.font = "11px " + col("--mono");
    let lo = Math.min(...b.map((x) => x.l)), hi = Math.max(...b.map((x) => x.h)); const pad = (hi - lo) * 0.06 || 1; lo -= pad; hi += pad;
    const L = Math.max(...[hi, lo].map((v) => ctx.measureText(f0.format(v)).width)) + 14, R = 70, T = 8, B = 22;
    const x = (i) => L + (i + 0.5) * (W - L - R) / b.length, y = (v) => T + (hi - v) / (hi - lo) * (H - T - B);
    ctx.strokeStyle = col("--line"); ctx.fillStyle = col("--fg3"); ctx.lineWidth = 1; ctx.textAlign = "right"; ctx.textBaseline = "middle";
    for (let k = 0; k <= 4; k++) { const v = lo + (hi - lo) * k / 4, yy = y(v); ctx.beginPath(); ctx.moveTo(L, yy); ctx.lineTo(W - R, yy); ctx.stroke(); ctx.fillText(f0.format(v), L - 6, yy); }
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    const fmtT = (t) => { const d = new Date(t); return st.tf === "1d" ? (d.getMonth() + 1) + "/" + d.getDate() : d.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", hour12: false }); };
    const every = Math.ceil(b.length / Math.max(2, Math.floor((W - L - R) / 80)));
    b.forEach((c, i) => { if (i % every === 0) ctx.fillText(fmtT(c.t), x(i), H - B + 6); });
    const w = Math.max(1, (W - L - R) / b.length * 0.7);
    b.forEach((c, i) => {
      const upc = c.c >= c.o; ctx.strokeStyle = ctx.fillStyle = upc ? col("--acc") : col("--bad");
      ctx.beginPath(); ctx.moveTo(x(i), y(c.h)); ctx.lineTo(x(i), y(c.l)); ctx.stroke();
      const top = y(Math.max(c.o, c.c)), hgt = Math.max(1, Math.abs(y(c.o) - y(c.c))); ctx.fillRect(x(i) - w / 2, top, w, hgt);
    });
    const last = b[b.length - 1], ly = y(last.c);
    ctx.setLineDash([3, 3]); ctx.strokeStyle = col("--fg2"); ctx.beginPath(); ctx.moveTo(L, ly); ctx.lineTo(W - R, ly); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = last.c >= last.o ? col("--acc") : col("--bad"); ctx.fillRect(W - R + 2, ly - 9, R - 4, 18);
    ctx.fillStyle = col("--bg"); ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(f0.format(last.c), W - R / 2, ly);
    st.geo = { L, R, W, x, n: b.length };
  }
  $("chart").addEventListener("pointermove", (e) => {
    const g = st.geo; if (!g) return; const r = cv.getBoundingClientRect(), mx = e.clientX - r.left;
    const i = Math.min(g.n - 1, Math.max(0, Math.floor((mx - g.L) / ((g.W - g.L - g.R) / g.n)))); const c = st.bars[i]; if (!c) return;
    const tip = $("tip"); tip.hidden = false;
    tip.textContent = new Date(c.t).toLocaleString("ko-KR", { hour12: false }) + "  시 " + f0.format(c.o) + " 고 " + f0.format(c.h) + " 저 " + f0.format(c.l) + " 종 " + f0.format(c.c);
    tip.style.left = Math.min(mx + 12, r.width - tip.offsetWidth - 4) + "px"; tip.style.top = "8px";
  });
  $("chart").addEventListener("pointerleave", () => { $("tip").hidden = true; });
  new ResizeObserver(draw).observe($("chart"));

  function loadBars(tf) {
    st.tf = tf;
    return fetch(BIN + "/api/v3/klines?symbol=BTCUSDT&interval=" + tf + "&limit=" + (tf === "1d" ? 180 : 150)).then((r) => r.json()).then((rows) => {
      st.bars = rows.map((r) => ({ t: r[0], o: +r[1], h: +r[2], l: +r[3], c: +r[4] })); draw(); openWS(tf);
    }).catch(() => { $("sys").textContent = "그래프 자료를 받지 못함 — 잠시 뒤 다시 시도"; });
  }
  function openWS(tf) {
    try { if (st.ws) st.ws.close(); } catch (e) {}
    const ws = new WebSocket(BWS + "/btcusdt@kline_" + tf + "/btcusdt@miniTicker"); st.ws = ws;
    ws.onopen = () => { st.live.b = true; setLive(); };
    ws.onclose = () => { st.live.b = false; setLive(); if (st.ws === ws) setTimeout(() => openWS(st.tf), 3000); };
    ws.onmessage = (m) => {
      const d = JSON.parse(m.data);
      if (d.e === "kline") { const k = d.k, bar = { t: k.t, o: +k.o, h: +k.h, l: +k.l, c: +k.c }; const b = st.bars; if (b.length && b[b.length - 1].t === bar.t) b[b.length - 1] = bar; else if (!b.length || bar.t > b[b.length - 1].t) { b.push(bar); if (b.length > 200) b.shift(); } draw(); }
      if (d.e === "24hrMiniTicker") { const p = +d.c; const el = $("p-usd"); if (st.usd != null && p !== st.usd) flash(el, p - st.usd); st.usd = p; el.textContent = f2.format(p); premium(); setLive(); }
    };
  }
  document.querySelectorAll("#tf button").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll("#tf button").forEach((x) => x.setAttribute("aria-pressed", x === b ? "true" : "false")); loadBars(b.dataset.i);
  }));
  loadBars("1m");

  // 업비트 원화 실시간(시세·체결)
  function openUpbit() {
    const ws = new WebSocket("wss://api.upbit.com/websocket/v1"); ws.binaryType = "arraybuffer"; st.up = ws;
    ws.onopen = () => { ws.send(JSON.stringify([{ ticket: "mo-" + Date.now() }, { type: "ticker", codes: ["KRW-BTC"] }, { type: "trade", codes: ["KRW-BTC"] }])); st.live.u = true; setLive(); };
    ws.onclose = () => { st.live.u = false; setLive(); setTimeout(openUpbit, 3000); };
    ws.onmessage = (m) => {
      const d = JSON.parse(typeof m.data === "string" ? m.data : new TextDecoder().decode(m.data));
      if (d.type === "ticker") { const el = $("p-krw"); if (st.krw != null && d.trade_price !== st.krw) flash(el, d.trade_price - st.krw); st.krw = d.trade_price; el.textContent = f0.format(d.trade_price); signed($("c-krw"), d.signed_change_rate * 100); premium(); }
      if (d.type === "trade") {
        const row = document.createElement("div");
        const t = document.createElement("span"); t.textContent = new Date(d.trade_timestamp).toLocaleTimeString("en-GB", { hour12: false });
        const p = document.createElement("span"); p.textContent = f0.format(d.trade_price); p.className = d.ask_bid === "BID" ? "up" : "down";
        const v = document.createElement("span"); v.textContent = d.trade_volume.toFixed(4);
        row.append(t, p, v); const tape = $("tape"); tape.prepend(row); while (tape.children.length > 60) tape.lastChild.remove();
      }
    };
  }
  openUpbit();

  const toggle = () => { const on = document.body.classList.toggle("cover"); $("cover").setAttribute("aria-pressed", on ? "true" : "false"); };
  $("cover").addEventListener("click", toggle);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") toggle(); });
  setInterval(setLive, 1000);
})();
</script>
</body>
</html>
