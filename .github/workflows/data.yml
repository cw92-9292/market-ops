name: market data
on:
  schedule:
    - cron: "7 * * * *"   # 매시 7분(UTC)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/fetch.mjs
      - name: commit
        run: |
          git config user.name "market-ops-bot"
          git config user.email "market-ops-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
